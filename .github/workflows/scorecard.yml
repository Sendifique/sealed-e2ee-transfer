name: Scorecard

# OpenSSF Scorecard: an outside, automated check of how this repository is
# run — pinned dependencies, branch protection, token permissions, signed
# releases, and more. The results are published to scorecard.dev (the badge
# in the README) and appear under Security → Code scanning.
#
# The job is kept to what Scorecard accepts for publishing results: no
# top-level env or defaults, and only the actions below.
on:
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the results to scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
